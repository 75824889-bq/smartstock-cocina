input[type=number]{text-align:right}label{font-size:12px;color:var(--mute);display:block}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

.det{background:var(--soft);border-radius:10px;padding:8px 11px;margin:-4px 0 8px;font-size:13px}.det table{width:100%;border-collapse:collapse}.det td{padding:5px 0;border-bottom:1px solid var(--line)}.det td:not(:first-child){text-align:right}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--navy);background:var(--card);color:var(--navy);font-size:13px;font-weight:bold}.seg button.on{background:var(--navy);color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.tabs div{max-width:460px;margin:0 auto;display:flex}.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font-size:11px;padding:8px 0;font-weight:bold;font-family:inherit}.tabs button.on{color:var(--navy);border-top:3px solid var(--navy)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}#toast.on{opacity:1}

<div class="wrap"><div class="top"><div style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" alt="" width="38" height="38" style="border-radius:9px"><div><h1>Smart Stock</h1><small>Cocina · Control de inventarios · v<span id="ver"></span></small></div></div><span class="mode" id="mode"></span></div><div id="app"></div></div>

<script>
var VER="1.2",NOV=[["1.2","Carta real de pizzas (13 pizzas con sus precios y medidas), precio de venta por pizza con su ganancia sobre ingredientes, y gráfico de ventas por día en la pestaña Ventas (en pizzas o en soles)."],["1.1","Facturas completas (editar, anular, filtros, exportar CSV, foto comprimida, vencimiento informativo, precios con o sin IGV); mermas y diferencias del conteo; editar y anular ventas; primeros pasos guiados; compra rápida; compartir la compra por WhatsApp; días que alcanza cada insumo; platos propios; recordatorio de copia semanal."],["1.0","Primera versión de Smart Stock Cocina: tres pizzas con recetas editables, ventas, stock con semáforo, compra sugerida, facturas de compra, conteo físico, respaldo y aviso de versión nueva."]];
var DEF={t0:0,igv:.18,pvs:[],rev:false,bk:"",ins:[
{id:"queso",n:"Queso mozzarella",u:"kg",c:1.5,seg:.5,lt:1,cov:3,pr:28,s0:0},{id:"masa",n:"Masa de pizza",u:"kg",c:3,seg:0,lt:1,cov:3,pr:4,s0:0},{id:"salsa",n:"Salsa de tomate",u:"kg",c:.8,seg:.2,lt:1,cov:3,pr:8,s0:0},{id:"jamon",n:"Jamón",u:"kg",c:.5,seg:.1,lt:1,cov:3,pr:32,s0:0},{id:"pina",n:"Piña en trozos",u:"kg",c:.3,seg:.1,lt:1,cov:3,pr:5,s0:0},{id:"pepp",n:"Pepperoni",u:"kg",c:.35,seg:.1,lt:1,cov:3,pr:45,s0:0},{id:"oreg",n:"Orégano",u:"kg",c:.03,seg:.01,lt:1,cov:3,pr:40,s0:0},{id:"aceite",n:"Aceite de oliva",u:"L",c:.3,seg:.1,lt:1,cov:3,pr:18,s0:0},{id:"aceit",n:"Aceitunas negras",u:"kg",c:.15,seg:.05,lt:1,cov:3,pr:20,s0:0}],
pz:[{id:"amer",n:"Pizza americana",d:"Jamón y queso",r:{masa:.25,salsa:.08,queso:.12,jamon:.06,oreg:.002,aceite:.01,aceit:.02}},{id:"hawa",n:"Pizza hawaiana",d:"Jamón y piña",r:{masa:.25,salsa:.08,queso:.12,jamon:.05,pina:.06,oreg:.002,aceite:.01}},{id:"pepp",n:"Pizza de pepperoni",d:"Pepperoni y queso",r:{masa:.25,salsa:.08,queso:.12,pepp:.06,oreg:.002,aceite:.01}}]};
var CARTA=[[421,"Pizza americana",51,"amer",2,"Jamón y queso"],[422,"Pizza americana mediana",26,"amer",1,"Jamón y queso"],[423,"Pizza hawaiana",51,"hawa",2,"Jamón y piña"],[424,"Pizza hawaiana mediana",26,"hawa",1,"Jamón y piña"],[425,"Pizza vegetariana",53,"vege",2,"Vegetales",1],[426,"Pizza vegetariana mediana",27,"vege",1,"Vegetales",1],[427,"Pizza selvática",56,"selv",2,"Carta",1],[428,"Pizza selvática mediana",28,"selv",1,"Carta",1],[429,"Pizza de lomo",66,"lomo",2,"Lomo",1],[430,"Pizza de pepperoni",56,"pepp",2,"Pepperoni y queso"],[432,"Pizza pepperoni mediana",28,"pepp",1,"Pepperoni y queso"],[431,"Pizza tutti frutti",51,"tutti",2,"Fruta",1],[433,"Pizza tutti frutti mediana",26,"tutti",1,"Fruta",1]];
var COLS=["ventas","facturas","conteos","mermas","compras"];
var MOT=["Vencido","Malogrado","Caída","Otro"];
var FORMAS=["Efectivo","Yape / Plin","Transferencia","Otro"];
var CONDS=["Contado","Crédito 15 días","Crédito 30 días"];
var TITULAR="";
var ST={cfg:null,ventas:[],facturas:[],conteos:[],mermas:[],compras:[],S:{},tab:"ini",sub:"sug",qv:{},ev:null,fd:null,qk:null,op:null,of:null,conf:null,cnt:null,nov:false,mm:false,pz:false,mas:null,gp:"7",gm:"p",vf:"",ff:{pv:"",d:"",h:""}};
function cl(o){return JSON.parse(JSON.stringify(o))}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return(+(+n).toFixed(2)).toString().replace(".",",")}
function m(n){return"S/ "+(+n).toFixed(2)}
function iso(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fd(s){var p=String(s).split("-");return p.length==3?p[2]+"/"+p[1]+"/"+p[0]:s}
function addD(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dias(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function opts(a,v){return a.map(function(x){return'<option'+(x==v?' selected':'')+'>'+esc(x)+'</option>'}).join("")}
function toast(t){var e=$("toast");e.textContent=t;e.className="on";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=""},2800)}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("ssc_"+k));localStorage.setItem("ssc_"+k,JSON.stringify(v));return true}catch(e){if(v!==undefined)toast("No se pudo guardar: memoria llena en este celular");return v===undefined?null:false}}
function tsN(){var t=Date.now();if(t<=tsN.l)t=tsN.l+1;tsN.l=t;return t}
function uso(){var n=0;try{for(var k in localStorage){if(k.indexOf("ssc_")==0)n+=(localStorage.getItem(k)||"").length*2}}catch(e){}return n/1048576}
/* ---------- datos (capa de almacenamiento: único punto a cambiar para una futura sincronización en la nube) ---------- */
function loadLocal(){ST.cfg=ls("cfg")||cl(DEF);["igv","pvs","t0","rev","bk"].forEach(function(k){if(ST.cfg[k]==null)ST.cfg[k]=cl(DEF[k])});COLS.forEach(function(c){ST[c]=ls(c)||[]});mig12()}
function mig12(){var c=ST.cfg;if(c.m12)return;var B={masa:.25,salsa:.08,queso:.12,oreg:.002,aceite:.01},ex={422:"amer",424:"hawa",432:"pepp"},O={amer:"Pizza americana",hawa:"Pizza hawaiana",pepp:"Pizza de pepperoni"},base={};
 function g(id){return c.pz.filter(function(p){return p.id==id})[0]}
 CARTA.forEach(function(r){var fm=r[3];if(!base[fm]){var e=g(fm);base[fm]=e?cl(e.r):cl(B)}});
 CARTA.forEach(function(r){var id=ex[r[0]]||"c"+r[0],p=g(id);
  if(p){if(p.n==O[id])p.n=r[1];if(p.pv==null)p.pv=r[2];p.cod=r[0]}
  else{var rec={};for(var k in base[r[3]])rec[k]=Math.round(base[r[3]][k]*r[4]*1e4)/1e4;c.pz.push({id:id,n:r[1],d:r[5],r:rec,pv:r[2],cod:r[0],pend:!!r[6]})}});
 c.pz.sort(function(a,b){return(a.cod||9999)-(b.cod||9999)});c.m12=1;saveCfg()}
function saveCfg(){ls("cfg",ST.cfg)}
function put(c,o){var a=ST[c],k=-1;a.forEach(function(x,i){if(x.id==o.id)k=i});if(k<0)a.push(o);else a[k]=o;a.sort(function(x,y){return x.ts-y.ts});ls(c,a)}
function del(c,id){ST[c]=ST[c].filter(function(x){return x.id!=id});ls(c,ST[c]);if(c=="facturas"){try{localStorage.removeItem("ssc_foto_"+id)}catch(e){}}}
function arm(c,id){var k=c+id;if(ST.conf!=k){ST.conf=k;render();return}ST.conf=null;del(c,id);render();toast("Anulado. El stock se ajustó solo.")}
/* ---------- cálculo ---------- */
function ins(id){return ST.cfg.ins.filter(function(x){return x.id==id})[0]||{id:id,n:"(insumo eliminado)",u:"",c:0,seg:0,lt:1,cov:3,pr:0}}
function mn(i){return i.c*i.lt+i.seg}function ob(i){return i.c*i.cov+i.seg}
function cons(q){var c={};ST.cfg.pz.forEach(function(p){var n=q[p.id]||0;for(var k in p.r)c[k]=(c[k]||0)+p.r[k]*n});return c}
function stockAll(){var base={},s={};ST.cfg.ins.forEach(function(i){base[i.id]=ST.cfg.t0||0;s[i.id]=+i.s0||0});
 ST.conteos.forEach(function(c){for(var id in c.q){if(base[id]!=null&&c.ts>=base[id]){base[id]=c.ts;s[id]=+c.q[id]}}});
 var add=function(e){e.it.forEach(function(l){if(base[l[0]]!=null&&e.ts>base[l[0]])s[l[0]]+=+l[1]})};ST.facturas.forEach(add);ST.compras.forEach(add);
 ST.mermas.forEach(function(x){if(base[x.i]!=null&&x.ts>base[x.i])s[x.i]-=+x.q});
 ST.ventas.forEach(function(v){var c=cons(v.q);for(var id in c)if(base[id]!=null&&v.ts>base[id])s[id]-=c[id]});
 for(var k in s)s[k]=Math.round(Math.max(0,s[k])*1000)/1000;return s}
function est(i,s){if(!ST.conteos.length)return"n";var a=mn(i);return s<a?"r":(s<=a*1.5?"a":"g")}
function col(x){return x=="r"?"var(--r)":x=="a"?"var(--a)":x=="g"?"var(--g)":"var(--mute)"}
function lab(x){return x=="r"?"Comprar":x=="a"?"Revisar":x=="g"?"Adecuado":"Sin conteo"}
function sug(){var L=[];ST.cfg.ins.forEach(function(i){if(est(i,ST.S[i.id])!="g"&&est(i,ST.S[i.id])!="n"){var q=Math.round((ob(i)-ST.S[i.id])*10)/10;if(q>0)L.push({i:i.id,q:q})}});return L}
function pcost(p){var t=0;for(var k in p.r){var i=ins(k);t+=p.r[k]*i.pr}return t}
function tots(it,incl,ig){var t=0;it.forEach(function(l){t+=l.q*l.p});var sub=incl?t/(1+ig):t,iv=incl?t-sub:t*ig;return{sub:sub,igv:iv,tot:incl?t:t+iv}}
function hasFoto(x){try{return !!(x.foto&&localStorage.getItem("ssc_foto_"+x.id))}catch(e){return false}}
function fT(x){var s=0;x.it.forEach(function(l){s+=l[1]*l[2]});var g=x.igv==null?ST.cfg.igv:x.igv;return{sub:s,igv:s*g,tot:s*(1+g)}}
/* ---------- Inicio ---------- */
function guia(){var c=ST.conteos.length>0,v=ST.ventas.length>0,rv=!!ST.cfg.rev;if(c&&v&&rv)return"";
 return'<div class="card"><h2>Primeros pasos</h2><div class="item"><span>'+(c?"✔ ":"1. ")+'Conteo físico inicial</span>'+(c?'':'<button class="btn s" style="margin:0" onclick="goCnt()">Hacer</button>')+'</div><div class="item"><span>'+(rv?"✔ ":"2. ")+'Revisar recetas y mínimos</span>'+(rv?'':'<button class="btn s" style="margin:0" onclick="go(\'piz\')">Ver</button>')+'</div><div class="item"><span>'+(v?"✔ ":"3. ")+'Registrar la primera venta</span>'+(v?'':'<button class="btn s" style="margin:0" onclick="go(\'ven\')">Registrar</button>')+'</div>'+(rv?'':'<button class="btn o" onclick="ST.cfg.rev=true;saveCfg();render()">Ya revisé recetas y mínimos</button>')+(c?'':'<div class="sm" style="margin-top:6px">Mientras no haga el conteo inicial, no se muestran alertas.</div>')+'</div>'}
function backupMsg(){if(!(ST.ventas.length||ST.facturas.length||ST.conteos.length))return"";var b=ST.cfg.bk,d=b?dias(b,iso()):null;if(b&&d<7)return"";return'<div class="msg m-a"><b>Copia de seguridad:</b> '+(b?'hace '+d+' días que no hace una copia.':'todavía no hizo ninguna copia.')+'<button class="btn s" style="margin:6px 0 0;display:block" onclick="expo()">Hacer copia ahora</button></div>'}
function vIni(){var S=ST.S,L=sug(),r=0,a=0,h=guia()+backupMsg(),hc=ST.conteos.length>0;
 ST.cfg.ins.forEach(function(i){var x=est(i,S[i.id]);if(x=="r")r++;if(x=="a")a++});
 if(hc&&r)h+='<div class="msg m-r"><b>Alerta:</b> bajo el mínimo: '+ST.cfg.ins.filter(function(i){return est(i,S[i.id])=="r"}).map(function(i){return esc(i.n.toLowerCase())+' ('+f(S[i.id])+' '+i.u+')'}).join(", ")+'.</div>';
 var td=iso(),hoy=0,hs=0;ST.ventas.forEach(function(v){if(v.fecha==td){for(var k in v.q)hoy+=v.q[k];hs+=vVal(v,"s")}});
 h+='<div class="kpis"><div class="kpi"><b>'+hoy+'</b><span>Pizzas hoy</span></div><div class="kpi"><b class="c-r">'+(hc?r:"—")+'</b><span>Críticos</span></div><div class="kpi"><b class="c-a">'+(hc?a:"—")+'</b><span>Por revisar</span></div><div class="kpi"><b>'+(hc?L.length:"—")+'</b><span>Compras sugeridas</span></div></div>';
 h+='<div class="card"><h2>Compra sugerida</h2>'+(!hc?'<div class="sm">Se calcula después del conteo inicial.</div>':L.length?L.map(function(x){var i=ins(x.i);return'<div class="item"><span>'+esc(i.n)+'</span><b>'+f(x.q)+' '+i.u+'</b></div>'}).join("")+'<button class="btn" onclick="irFac()">Registrar factura de esta compra</button><button class="btn o" onclick="waSug()">Compartir por WhatsApp</button>':'<div class="sm">No hay compras pendientes.</div>')+'</div>';
 h+='<div class="card"><h2>Ventas de hoy</h2>'+(hoy?ST.cfg.pz.map(function(p){var n=0;ST.ventas.forEach(function(v){if(v.fecha==td)n+=v.q[p.id]||0});return n?'<div class="item"><span>'+esc(p.n)+'</span><b>'+n+'</b></div>':''}).join("")+(hs>0?'<div class="item"><span><b>Total vendido hoy</b></span><b>'+m(hs)+'</b></div>':''):'<div class="sm">Todavía no se registraron ventas hoy.</div>')+'</div>';return h}
function goCnt(){go("stk");startCnt()}

 if(c)h+='<div class="card"><h2>Exactitud del último conteo</h2><div class="sm">'+fd(c.fecha)+' · inventario exacto al <b>'+Math.round(c.ex*100)+' %</b></div></div>';
